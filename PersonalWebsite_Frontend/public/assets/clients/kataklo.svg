<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 540" role="img" aria-label="Kataklo athletic dance theatre">
  <defs>
    <filter id="kataklo-glow" x="-25%" y="-45%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="540" fill="#020202"/>
  <text x="512" y="266" text-anchor="middle" fill="#f6f6f6" filter="url(#kataklo-glow)" font-family="Arial, Helvetica, sans-serif" font-size="172" font-weight="300" letter-spacing="12">KATAKLO</text>
  <text x="512" y="336" text-anchor="middle" fill="#f6f6f6" filter="url(#kataklo-glow)" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="300" letter-spacing="4">athletic dance theatre</text>
</svg>
