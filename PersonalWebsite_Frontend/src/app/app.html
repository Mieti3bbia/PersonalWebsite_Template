<header class="site-header" aria-label="Primary navigation">
  <a class="logo" routerLink="/home" aria-label="Vai alla home">
    <span class="logo-mark" aria-hidden="true"></span>
    <span class="logo-name">
      <span>maria sole</span>
      <span>montironi lasca</span>
    </span>
  </a>

  <div class="header-actions">
    <a class="book-now-nav-link" routerLink="/contacts">Book now</a>

    <button
      class="mobile-menu-toggle"
      type="button"
      aria-label="Apri menu"
      aria-controls="primary-nav-links"
      [attr.aria-expanded]="mobileMenuOpen"
      (click)="toggleMobileMenu()"
    >
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>

    <nav id="primary-nav-links" class="nav-links" [class.is-open]="mobileMenuOpen" aria-label="Menu principale">
      <a routerLink="/portfolio" routerLinkActive="is-active" (click)="closeMobileMenu()">portfolio</a>
      <a routerLink="/servizi" routerLinkActive="is-active" (click)="closeMobileMenu()">servizi</a>
      <a routerLink="/aboutme" routerLinkActive="is-active" (click)="closeMobileMenu()">About me</a>
      <a routerLink="/curriculumvitae" routerLinkActive="is-active" (click)="closeMobileMenu()">CV</a>
    </nav>
  </div>
</header>

<router-outlet />

<button class="floating-go-back-link" type="button" (click)="goBack($event)" aria-label="Go back">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M14.7 5.3 8 12l6.7 6.7-1.4 1.4L5.2 12l8.1-8.1 1.4 1.4Z"/>
  </svg>
</button>

<a class="floating-contact-link" routerLink="/contact" routerLinkActive="is-active" aria-label="Open contact page">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 5h16v14H4V5Zm2 2v.28l6 4.5 6-4.5V7H6Zm12 10V9.78l-6 4.5-6-4.5V17h12Z"/>
  </svg>
</a>

<footer class="site-footer">
  <p>&copy; Copyright 2026 all rights reserved</p>
</footer>
